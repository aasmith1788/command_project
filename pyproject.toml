[project]
name = "command-plus-26"
version = "0.1.0"
description = "Command+ V6: Three-stage Bayesian pitcher command metric"
requires-python = ">=3.11"
dependencies = [
    "pymc>=5.0.0",
    "arviz>=0.17.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0,<2.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "pyarrow>=15.0.0",
    "nutpie>=0.16.8",
    "numba>=0.67.0",
]

[tool.uv]
package = false
dev-dependencies = [
    "jupyterlab>=4.0.0",
    "ipykernel>=6.29.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
